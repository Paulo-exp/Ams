<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Periodica</title>
</head>
<body>
    <header>
        <h1>Tabela Periodica </h1>
    </header>
    <main>
        <table>
            <tr>
            <th class="title"> 1A </th>
            <td colspan="16"></td>
            <th class="title"> 8A </th>
            </tr>
            <tr>
                <td>
                    <div class="elemento naometais">
                        <p class="indice"> 1 </p>
                        <p class="sigla"> H </p>
                        <p class="nome"> Hidrogênio</p>
                    </div>
                </td>
                <th class="title"> 2A </th>
                <td colspan="10"></td>
                <th class="title"> 3A </th>
                <th class="title"> 4A </th>
                <th class="title"> 5A </th>
                <th class="title"> 6A </th>
                <th class="title"> 7A </th>

                <td>
                    <div class="elemento gasnobres">
                        <p class="indice"> 2 </p>
                        <p class="sigla"> He </p>
                        <p class="nome"> Hélio </p>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <div class="elemento metaisalcalinos">
                        <p class="indice"> 3 </p>
                        <p class="sigla"> Li </p>
                        <p class="nome"> Lítio </p>
                    </div>
                </td>
                <td>
                    <div class="elemento metaisalcalinosterrosos">
                        <p class="indice"> 4 </p>
                        <p class="sigla"> Be </p>
                        <p class="nome"> Berílio </p>
                    </div>
                </td>
                <td colspan="10"></td>
                <td>
                    <div class="elemento semimetais">
                        <p class="indice"> 5 </p>
                        <p class="sigla"> Bo </p>
                        <p class="nome"> Boro </p>
                    </div>
                </td>
                <td>
                    <div class="elemento naometais">
                        <p class="indice"> 6 </p>
                        <p class="sigla"> C </p>
                        <p class="nome"> Carbono </p>
                    </div>
                </td>
                <td>
                    <div class="elemento naometais">
                        <p class="indice"> 7 </p>
                        <p class="sigla"> N </p>
                        <p class="nome"> Nitrogênio </p>
                    </div>
                </td>
                 <td>
                    <div class="elemento naometais">
                        <p class="indice"> 8 </p>
                        <p class="sigla"> O </p>
                        <p class="nome"> Oxigênio </p>
                    </div>
                </td>
                 <td>
                    <div class="elemento helogenios">
                        <p class="indice"> 9 </p>
                        <p class="sigla"> F </p>
                        <p class="nome"> Flúor </p>
                    </div>
                </td>
                 <td>
                    <div class="elemento gasnobres">
                        <p class="indice"> 10 </p>
                        <p class="sigla"> Nw </p>
                        <p class="nome"> Neôneio </p>
                    </div>
                </td>
            </tr>
        </table>
    </main>
</body>
</html>
