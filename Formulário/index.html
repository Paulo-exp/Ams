<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de Contato Dev">
    <meta name="Keywords" content="HTML, CSS, Formulario, Contato">
    <link rel="stylesheet" href="CSS/reset.css">

    <title>Cadastro Dev</title>
</head>
<body>
    <main>
        <div class="header">
           <h1 id="titulo">Cadastro de Devs</h1>
           <p id="subtitulo">Complete suas informações</p>
        </div>
        <form action="#" method="post" autocomplete="off">
            <fieldset class="grupo">
                <div class="campo">
                  <label for="nome"><strong>Nome</strong></label>
                   <input type="text" name="nome" id="nome" required>
                </div>

                <div class="campo">
                  <label for="sobrenome"><strong>Sobrenome</strong></label>
                   <input type="text" name="sobrenome" id="sobrenome" required>
                </div>
            </fieldset>

            <div class="campo">
                  <label for="email"><strong>Email</strong></label>
                   <input type="email" name="email" id="email" required>
                </div>

                <div class="campo">
                    <label><strong>De qual lado da aplicação você desenvolve</strong></label>
                      <label>
                        <input type="radio" name="devweb" value="frontend" checked>
                        Front-end
                      </label>

                      <label>
                        <input type="radio" name="devweb" value="backend">
                        Back-end
                      </label>

                      <label>
                        <input type="radio" name="devweb" value="fullstack">
                        Fullstack
                      </label>
                </div>

                <div class="campo">
                    <label for="senioridade"><strong>Senioridade</strong></label>
                    <select name="senioridade" id="senioridade" required>
                        <option selected disabled value="Selecione"></option>
                        <option value="junior">Junior</option>
                        <option value="pleno">Pleno</option>
                        <option value="senior">Sênior</option>
                    </select>
                </div>

                <fieldset class="grupo">
                    <legend><strong>Selecione as tecnologias que utiliza:</strong></legend>
                    <label>
                            <input type="checkbox" name="tecnologia" value="html">
                            HTML
                    </label>
                    <label>
                          <input type="checkbox" name="tecnologia" value="css">
                          CSS
                    </label>

                    <label>
                          <input type="checkbox" name="tecnologia" value="javascript">
                          JavaScript
                    </label>

                    <label>
                          <input type="checkbox" name="tecnologia" value="php">
                          PHP
                    </label>

                    <label>
                          <input type="checkbox" name="tecnologia" value="csharp">
                          C#
                    </label>

                    <label>
                         <input type="checkbox" name="tecnologia" value="python">
                         Python
                    </label>

                    <label>
                         <input type="checkbox" name="tecnologia" value="java">
                         Java
                    </label>
                </fieldset>
                <div class="campo">
                    <label for="experiencia"><strong>Conte um pouco mais da sua experiencia:</strong></label>
                    <textarea name="experiencia" id="experiencia" rows="6" cols="47" placeholder="Descreva sua esperiência"></textarea>

                </div>
                <div class="button">
                    <button class="botao" type="submit">Conluído</button>
                </div>


        </form>
    </main>
    <footer class="footer-center">
        <p>&copy; 2026 Cadastro de Desenvlvimento. Todos os direitos reservados</p>
    </footer>
</body>
</html>
